<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Google Tag Manager -->
    <script>
      ((w, d, s, l, i) => {
        w[l] = w[l] || [];
        w[l].push({ "gtm.start": Date.now(), event: "gtm.js" });
        const f = d.getElementsByTagName(s)[0];
        const j = d.createElement(s);
        const dl = l !== "dataLayer" ? `&l=${l}` : "";
        j.async = true;
        j.src = `https://www.googletagmanager.com/gtm.js?id=${i}${dl}`;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "GTM-KXNDQVC3");
    </script>
    <!-- End Google Tag Manager -->
    <title>Cookie Run tools</title>
    <meta
      name="description"
      content="Small browser tools for Cookie Run. Everything runs in your browser."
    />
    <!-- Fairy Cookie (assets/index.json -> cookies.FairyCookie); the build
         inlines it as a data URI, so the page stays self-contained. -->
    <link rel="icon" href="../../assets/cookies/ch26.png" />
    <!-- Blocking on purpose: the module script below is deferred, so without
         this the page paints in the system theme and then flips. -->
    <script id="theme-boot">
      var stored = null;
      try {
        stored = localStorage.getItem("theme");
      } catch {}
      if (stored === "light" || stored === "dark")
        document.documentElement.dataset.theme = stored;
    </script>
    <link rel="stylesheet" href="./index.css" />
    <script src="./index.ts" type="module"></script>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        title="Google Tag Manager"
        src="https://www.googletagmanager.com/ns.html?id=GTM-KXNDQVC3"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <a class="skip-link" href="#content">Skip to content</a>
    <site-nav></site-nav>

    <header class="masthead container">
      <h1>Cookie Run tools</h1>
      <p>
        Small tools for things the game does not write down for you. Each one
        runs entirely in your browser.
      </p>
    </header>

    <main id="content" class="container" tabindex="-1">
      <section aria-labelledby="tools-heading">
        <h2 id="tools-heading">Tools</h2>
        <tool-index></tool-index>
      </section>
    </main>

    <site-footer></site-footer>
  </body>
</html>
