name: Deploy Preview

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
    environment:
      name: preview
      ## NOTE: The deployment-url output didn't support alias url so we built it manually
      ## https://github.com/cloudflare/wrangler-action/blob/a17640ae5ec0d99c8c75e908aa69f5519037cd4e/src/commandOutputParsing.ts#L118
      url: https://pr-${{ github.event.number }}-cookierun.kc.in.th/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install
      # The pull request's own head commit, not `github.sha`: on a
      # `pull_request` event that is the merge commit the runner checked out,
      # which exists nowhere on GitHub and whose commit link would 404.
      - id: stamp
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        id: deploy
        env:
          BUN_PUBLIC_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          BUN_PUBLIC_BUILT_AT: ${{ steps.stamp.outputs.at }}
        with:
          command: versions upload --preview-alias pr-${{ github.event.number }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
